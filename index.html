<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css?v=4">
  <title>Task Fairy</title>
</head>
<body>

  <main>

    <img src="assets/fairy.png" alt="Task Fairy" class="fairy">

    <h1>Task Fairy</h1>

    <p>A tiny magical productivity app.</p>

    <section class="demo" aria-label="Task Fairy app demonstration">
      <video id="task-fairy-demo" autoplay muted loop playsinline preload="auto">
        <source src="assets/task-fairy-demo.mp4" type="video/mp4">
        Your browser does not support embedded video.
      </video>
    </section>

    <a href="privacy.html">Privacy Policy</a>

  </main>

  <script>
    const demoVideo = document.getElementById("task-fairy-demo");

    demoVideo.muted = true;
    demoVideo.play().catch(() => {
      demoVideo.addEventListener("canplay", () => demoVideo.play(), { once: true });
    });
  </script>

</body>
</html>
